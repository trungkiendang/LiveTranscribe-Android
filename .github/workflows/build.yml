name: Build & Release

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # app/build.gradle.kts reads GITHUB_RUN_NUMBER for versionCode/versionName.
      # Set it explicitly from this workflow context so CI releases always
      # get monotonically increasing Play Store-safe version codes.
      GITHUB_RUN_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so softprops/action-gh-release can build release notes.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate AdMob secrets
        # Same-repo PRs get repository secrets, so build them like pushes.
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for key in GOOGLE_SERVICES_JSON_B64 ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_FILE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::$key is not set in GitHub repository secrets."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Generate app/google-services.json from secret
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          mkdir -p app
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - name: Placeholder google-services.json (PRs without secrets)
        # Dependabot and fork PRs get no repository secrets; the Google Services
        # plugin only needs a syntactically valid file to compile and run tests.
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
        run: |
          mkdir -p app
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.charles.livecaptionn" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-placeholder" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Generate signing files from secrets
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          cat > keystore.properties <<EOF
          storeFile=$ANDROID_KEYSTORE_FILE
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Generate CI local.properties
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
        run: |
          cat > local.properties <<EOF
          translate.url=http://localhost:3006
          stt.url=http://localhost:9000/asr?output=json
          EOF

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest testPlaystoreDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Build release APKs and App Bundles
        run: ./gradlew assembleRelease bundleRelease

      # Compute a tag name for release filenames and GitHub release publishing.
      - name: Compute release tag
        id: tag
        if: github.event_name == 'push'
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release files with live-caption names
        if: github.event_name == 'push'
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          GITHUB_APK="app/build/outputs/apk/github/release/app-github-release.apk"
          GITHUB_AAB="app/build/outputs/bundle/githubRelease/app-github-release.aab"
          PLAY_AAB="app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab"
          test -f "$GITHUB_APK"
          test -f "$GITHUB_AAB"
          test -f "$PLAY_AAB"
          cp "$GITHUB_APK" "app/build/outputs/apk/github/release/live-caption-${TAG}-github.apk"
          cp "$GITHUB_AAB" "app/build/outputs/bundle/githubRelease/live-caption-${TAG}-github.aab"
          cp "$PLAY_AAB" "app/build/outputs/bundle/playstoreRelease/live-caption-${TAG}-playstore.aab"

      - name: Upload debug APK (github flavor)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-github
          path: app/build/outputs/apk/github/debug/app-github-debug.apk

      - name: Upload debug APK (playstore flavor)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-playstore
          path: app/build/outputs/apk/playstore/debug/app-playstore-debug.apk

      - name: Upload release APK (GitHub / self-update)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: live-caption-release-apk-github
          path: app/build/outputs/apk/github/release/live-caption-${{ steps.tag.outputs.name }}-github.apk

      - name: Upload release AAB (GitHub / self-update)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: live-caption-release-aab-github
          path: app/build/outputs/bundle/githubRelease/live-caption-${{ steps.tag.outputs.name }}-github.aab

      - name: Upload release AAB (Play Store)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: live-caption-release-aab-playstore
          path: app/build/outputs/bundle/playstoreRelease/live-caption-${{ steps.tag.outputs.name }}-playstore.aab

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: LiveCaptionN ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/github/debug/app-github-debug.apk
            app/build/outputs/apk/github/release/live-caption-${{ steps.tag.outputs.name }}-github.apk
            app/build/outputs/bundle/githubRelease/live-caption-${{ steps.tag.outputs.name }}-github.aab
            app/build/outputs/bundle/playstoreRelease/live-caption-${{ steps.tag.outputs.name }}-playstore.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
