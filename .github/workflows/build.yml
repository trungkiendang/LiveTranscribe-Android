name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: sh gradlew testGithubDebugUnitTest

      # With the signing secrets set, build a release APK signed with the project's own key. Updates
      # only install over an app signed with the SAME key, so in-app updates need this. Without the
      # secrets (forks) it falls back to a debug-signed APK, which cannot update an earlier build.
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > liven-release.jks
            printf 'storeFile=liven-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            sh gradlew assembleGithubRelease
            cp app/build/outputs/apk/github/release/app-github-release.apk "liven-${{ github.run_number }}.apk"
            rm -f liven-release.jks keystore.properties
          else
            echo "::warning::Signing secrets are not set: building a debug-signed APK."
            sh gradlew assembleGithubDebug
            cp app/build/outputs/apk/github/debug/app-github-debug.apk "liven-${{ github.run_number }}.apk"
          fi

      - name: Stable release asset name
        run: cp "liven-${{ github.run_number }}.apk" LiveN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: liven-apk
          path: liven-${{ github.run_number }}.apk

      # Every merge/push to main publishes a release. The tag v1.0.<run number> matches the app's
      # versionName, which is what the in-app update checker compares against.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: LiveN v1.0.${{ github.run_number }}
          files: LiveN.apk
          generate_release_notes: true
