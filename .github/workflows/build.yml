name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # The Google Services plugin needs a syntactically valid file to build.
      # Firebase is not used in this fork, so a placeholder is enough.
      - name: Placeholder google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "placeholder", "storage_bucket": "placeholder.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.kun.livetranslation" } },
              "oauth_client": [],
              "api_key": [ { "current_key": "placeholder" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Unit tests
        run: sh gradlew testGithubDebugUnitTest

      # Debug-signed APK: installable directly, no keystore secrets needed.
      - name: Build APK
        run: sh gradlew assembleGithubDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/github/debug/app-github-debug.apk "liven-${{ github.run_number }}.apk"

      - name: Stable release asset name
        run: cp "liven-${{ github.run_number }}.apk" LiveN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: liven-apk
          path: liven-${{ github.run_number }}.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiveN.apk
          generate_release_notes: true
